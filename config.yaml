# ============================================================
# FILE: config.yaml
#
# ai.target is the ONLY hardware switch. It names the inference
# BACKEND, not the board — a Coral runs "cpu" perfectly well:
#
#   cpu     -> models/heron_cpu_int8.tflite  (tflite-runtime, either board)
#   edgetpu -> models/heron_edgetpu.tflite   (Edge TPU delegate, Coral only)
#
# Use "cpu" today. The compiled Edge TPU model detects nothing —
# full-integer quantisation destroyed its classification head, so
# every anchor scores ~1e-5. See README.md "Edge TPU status".
#
# Twilio credentials are never stored here. Set them as
# environment variables — see heron-deterrent.service.
# ============================================================

motion:
  sensitivity: 5000
  cooldown_seconds: 10

ai:
  target: cpu
  # Measured on the May model: 96% recall over 80 heron images, and clear of the
  # ~0.70 spikes seen on non-heron frames. Raise if you get false triggers.
  confidence_threshold: 0.75
  num_threads: 4               # CPU inference only; ignored when target is edgetpu
  labels:
    0: "heron"                 # The trained model is single-class. Adding entries
                               # here fails at startup rather than mislabelling.

alert:
  # No Twilio account yet. To enable: create /etc/heron-deterrent.env with the
  # four TWILIO_* variables (root-owned, mode 600 — see heron-deterrent.service),
  # then set this to true. No code change needed.
  sms_enabled: false
  sms_throttle_minutes: 15

audio:
  volume: 80
  sound_path: "./sounds/"

storage:
  retention_days: 365
  # Hard ceiling on everything under media/. Retention by age cannot protect a
  # small card: at 100 events/day a 2 GB partition fills in about four months,
  # long before a 365-day cutoff removes anything. Oldest clips go first.
  # The Coral's /home is a separate 2 GB partition — check with: df -h /home
  max_media_gb: 1.0
  media_path: "./media/"
  db_path: "./data/heron.db"

mqtt:
  enabled: false
  broker: "localhost"
  port: 1883
  topics:
    detection: "heron/detection"
    alert: "heron/alert"
    unclassified: "heron/unclassified"
    status: "heron/system/status"

system:
  active_hours:
    start: "06:00"
    end: "20:00"
  camera_device_id: 0
  frame_rate: 5
  resolution:
    width: 640
    height: 480
