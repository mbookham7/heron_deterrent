# ============================================================
# FILE: config.yaml
#
# ai.target is the ONLY hardware switch. It selects both the
# model file and the inference backend:
#
#   coral -> models/heron_coral_edgetpu.tflite  (Edge TPU delegate)
#   pi    -> models/heron_pi_int8.tflite        (CPU tflite-runtime)
#
# Twilio credentials are never stored here. Set them as
# environment variables — see heron-deterrent.service.
# ============================================================

motion:
  sensitivity: 5000
  cooldown_seconds: 10

ai:
  target: coral
  # Measured on the May model: 96% recall over 80 heron images, and clear of the
  # ~0.70 spikes seen on non-heron frames. Raise if you get false triggers.
  confidence_threshold: 0.75
  num_threads: 4               # CPU inference only; ignored when target is coral
  labels:
    0: "heron"                 # The trained model is single-class. Adding entries
                               # here fails at startup rather than mislabelling.

alert:
  sms_enabled: true
  sms_throttle_minutes: 15

audio:
  volume: 80
  sound_path: "./sounds/"

storage:
  retention_days: 365
  media_path: "./media/"
  db_path: "./data/heron.db"

mqtt:
  enabled: false
  broker: "localhost"
  port: 1883
  topics:
    detection: "heron/detection"
    alert: "heron/alert"
    unclassified: "heron/unclassified"
    status: "heron/system/status"

system:
  active_hours:
    start: "06:00"
    end: "20:00"
  camera_device_id: 0
  frame_rate: 5
  resolution:
    width: 640
    height: 480
