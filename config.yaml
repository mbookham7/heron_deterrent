# ============================================================
# FILE: config.yaml
#
# ai.target is the ONLY hardware switch. It names the inference
# BACKEND, not the board — a Coral runs "cpu" perfectly well:
#
#   cpu     -> models/heron_cpu_int8.tflite  (tflite-runtime, either board)
#   edgetpu -> models/heron_edgetpu.tflite   (Edge TPU delegate, Coral only)
#
# Use "cpu" today. The compiled Edge TPU model detects nothing —
# full-integer quantisation destroyed its classification head, so
# every anchor scores ~1e-5. See README.md "Edge TPU status".
#
# Twilio credentials are never stored here. Set them as
# environment variables — see heron-deterrent.service.
# ============================================================

motion:
  sensitivity: 5000
  cooldown_seconds: 10

ai:
  target: cpu
  # Two thresholds, because one number cannot do both jobs. A false BANG is
  # nearly free; being 9.6 s late to it is not — so the deter path is fast and
  # optimistic. A false ALERT costs the user's attention and their trust in
  # the dashboard — so the alert path is strict and confirmed across frames.
  #
  #   deter_threshold  — fires the sound. Single trigger frame, max-pool.
  #   alert_threshold  — governs recording + SMS + dashboard stats.
  #                       Requires alert_vote_k of the last alert_vote_m
  #                       key frames to clear it (not the previous max-pool,
  #                       which handed a spurious spike five chances to win).
  #
  # These defaults are measured, not vibes: run tools/measure_thresholds.py
  # to re-derive them from the current media/ snapshot. Do that when you have
  # more field data — the current sample is thin.
  deter_threshold: 0.90
  alert_threshold: 0.95
  alert_vote_k: 3              # need k of the last m key frames above alert_threshold
  alert_vote_m: 5              # matches extract_key_frames default in main.py
  # Deprecated: kept as a fallback so an older config still boots. If both new
  # keys are missing, both paths use this. Remove once every deployment has
  # migrated.
  confidence_threshold: 0.90
  num_threads: 4               # CPU inference only; ignored when target is edgetpu
  labels:
    0: "heron"                 # The trained model is single-class. Adding entries
                               # here fails at startup rather than mislabelling.

alert:
  # No Twilio account yet. To enable: create /etc/heron-deterrent.env with the
  # four TWILIO_* variables (root-owned, mode 600 — see heron-deterrent.service),
  # then set this to true. No code change needed.
  sms_enabled: false
  sms_throttle_minutes: 15

audio:
  volume: 80
  sound_path: "./sounds/"

storage:
  retention_days: 365
  # Hard ceiling on the ephemeral clip dirs (heron/, other/, unknown/). Retention
  # by age cannot protect a small card: at 100 events/day a 2 GB partition fills
  # in about four months, long before a 365-day cutoff removes anything. Oldest
  # clips go first.
  # The Coral's /home is a separate 2 GB partition — check with: df -h /home
  max_media_gb: 1.0
  # Soft warning for labeled/. NEVER causes deletion — the training data must
  # not be silently destroyed by a size sweep. If it trips, move labeled/ off
  # the card, do not raise the limit and forget.
  max_labeled_gb: 5.0
  media_path: "./media/"
  db_path: "./data/heron.db"

mqtt:
  enabled: false
  broker: "localhost"
  port: 1883
  topics:
    detection: "heron/detection"
    alert: "heron/alert"
    unclassified: "heron/unclassified"
    status: "heron/system/status"

system:
  active_hours:
    start: "06:00"
    end: "20:00"
  camera_device_id: 0
  frame_rate: 5
  resolution:
    width: 640
    height: 480

# ------------------------------------------------------------------
# COLLECT MODE — data collection at the pond.
#
# The point of this flag: put the device out with the model as-is and
# have it manufacture training data instead of relying on it. Collect
# mode records any motion event whose best key-frame score clears
# record_threshold (much lower than alert_threshold), so the dashboard
# fills with borderline cases you can then label. deterrent_enabled
# is separate: you may want to collect data with the sound OFF, so
# behaviour is not confounded by the deterrent going off constantly.
#
# Off in production. Alerts and the deter path work exactly as before
# when this is off.
# ------------------------------------------------------------------
collect_mode:
  enabled: false
  record_threshold: 0.30   # everything above this gets a clip on disk
  deterrent_enabled: true  # independently switchable — false = silent run
